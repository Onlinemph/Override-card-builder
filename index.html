        <p class="tagline">
          Convert a MegaMek <code>.mtf</code> BattleMech or <code>.blk</code>
          Battle Armor squad into BattleTech: Override record-card stats.
          Everything runs in your browser.
        </p>
      </header>

      <section class="browse" id="browse">
        <div class="browse-header">
          <h2 class="browse-title">Browse Units <span class="browse-count muted" id="browse-count"></span></h2>
          <button id="browse-toggle" type="button" class="browse-toggle" aria-expanded="true" aria-controls="browse-body">▲ Hide</button>
        </div>
        <div id="browse-body" class="browse-body">
          <div class="browse-controls">
            <select id="browse-cat" class="browse-cat">
              <option value="">All categories</option>
            </select>
            <input id="browse-q" type="search" class="browse-q" placeholder="Search by name…" autocomplete="off" spellcheck="false" />
          </div>
          <div id="browse-list" class="browse-list" role="listbox" aria-label="Unit list"></div>
          <p class="browse-status muted" id="browse-status">Loading unit index…</p>
        </div>
      </section>

      <section class="input">
        <div class="toolbar">
          <button id="upload" type="button">Upload .mtf / .blk file(s)</button>
          <input id="file" type="file" accept=".mtf,.blk,text/plain" multiple hidden />
          <button id="example" type="button">Example: Locust (’Mech)</button>
          <button id="example-ba" type="button">Example: Elemental (BA)</button>
          <button id="clear" type="button">Clear</button>
        </div>
        <textarea
          id="mtf"
          spellcheck="false"
          placeholder="Paste .mtf or .blk text here, or upload a file above…"
        ></textarea>
        <button id="convert" type="button" class="primary">Convert</button>
      </section>

      <section id="output" class="output" aria-live="polite"></section>

      <footer>
        <p>
          TMM upper bands (run &ge; 13) are inferred and unverified. Validate
          against the DFA Override Card Generator.
        </p>
        <p class="muted" id="build"></p>
      </footer>
    </main>

  </body>
</html>
