    <main id="app">
      <header>
        <h1>mtf2override</h1>
        <p class="tagline">
          Convert a MegaMek <code>.mtf</code> BattleMech or <code>.blk</code>
          Battle Armor squad into BattleTech: Override record-card stats.
          Everything runs in your browser.
        </p>

        <div class="toolbar">

          <button id="example" type="button">Example: Locust (’Mech)</button>
          <button id="example-ba" type="button">Example: Elemental (BA)</button>
          <button id="clear" type="button">Clear</button>

        <textarea
          id="mtf"
          spellcheck="false"
          placeholder="Paste .mtf or .blk text here, or upload a file above…"

        <button id="convert" type="button" class="primary">Convert</button>
      </section>

      <section id="output" class="output" aria-live="polite"></section>

      <footer>
        <p>

          against the DFA Override Card Generator.
        </p>
        <p class="muted" id="build"></p>
      </footer>
    </main>
